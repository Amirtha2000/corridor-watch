[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corridor-watch"
version = "0.1.0"
description = "Satellite-based vegetation encroachment monitoring for power transmission corridors (Sentinel-2 + OSM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amirtha Varshini Raja Sonathreesan Latha" }]
dependencies = [
    "geopandas>=0.14",
    "rasterio>=1.3",
    "shapely>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "folium>=0.15",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
fetch = ["pystac-client>=0.7"]
orchestration = ["prefect>=2.16"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
corridor-watch = "corridor_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
"corridor_watch.outputs" = ["vendor/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
