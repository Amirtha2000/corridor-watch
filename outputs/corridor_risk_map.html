    geo_json_4fd1983c1b072e2c8097fc6191a5e741.bindTooltip(
    function(layer){
    let div = L.DomUtil.create('div');
    
    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["rank", "segment_id", "km_start", "km_end", "risk_class", "risk_score", "veg_fraction", "growth_fraction", "ndvi_p90", "valid_fraction"];
    let aliases = ["rank", "segment_id", "km_start", "km_end", "risk_class", "risk_score", "veg_fraction", "growth_fraction", "ndvi_p90", "valid_fraction"];
    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i]}</th>
            
            <td>${handleObject(layer.feature.properties[v])}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
    ,{
  "sticky": true,
  "className": "foliumtooltip",
});
